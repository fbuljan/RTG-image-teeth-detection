# Phase 8.1 — FDI classifier retrained on rotation-canonicalised crops.
# Mirrors configs/tooth_classifier.yaml with: manifest swapped to manifest_clean_rotnorm.csv,
# rotation_degrees bumped to 20, output dir renamed.
experiment_name: tooth_fdi_rotnorm

data:
  manifest: identification/data/manifest_clean_rotnorm.csv
  crop_mode: raw
  target_col: tooth_fdi
  filter_nonempty: false
  num_workers: 0
  pin_memory: false

model:
  backbone: resnet18
  pretrained: true
  dropout: 0.2

train:
  batch_size: 64
  epochs: 30
  optimizer: AdamW
  lr: 0.001
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 2
  label_smoothing: 0.1
  class_weight_strategy: none

augmentation:
  rotation_degrees: 20
  translate: 0.05
  brightness: 0.1
  contrast: 0.1
  blur_kernel: 3
  blur_sigma_max: 0.5
  noise_sigma: 0.01

eval:
  val_every_n_epochs: 1
  patience: 8
  save_best_metric: val_accuracy

output:
  dir: identification/runs/tooth_fdi_rotnorm
  save_last: true
  save_best: true
