# Phase 8.3 — FDI-init embedder trained on a verified-aligned GT/YOLO crop blend.
# Identical to configs/embedding_fdi_init.yaml (deployed embedder) except:
# - data.yolo_blend section enables on-the-fly GT->YOLO crop substitution at training
#   time (prob=0.3, only on accept=True rows of pair_table_train.csv).
# - augmentations REVERT to deployed defaults (NO 8.2 scale jitter): rotation=10,
#   translate=0.05. The 8.3 hypothesis is "exposure to real YOLO crops fixes the
#   distribution shift"; we don't compound with 8.2's failed approach.
# - new output dir + experiment name.
#
# Crops: GT path stays manifest_clean.csv. At __getitem__ on train split only,
# ToothDataset substitutes GT crop -> matched YOLO crop with prob=0.3 when an
# accept=True entry exists in pair_table_train.csv. Val/test never blend.
experiment_name: embedding_fdi_init_blended_v1

data:
  manifest: identification/data/manifest_clean.csv
  crop_mode: raw
  target_col: person_id
  num_workers: 0
  pin_memory: false
  yolo_blend:
    pair_table: identification/data/pair_table_train.csv
    prob: 0.3

model:
  backbone: resnet18
  pretrained: true
  embedding_dim: 128
  dropout: 0.2

init_from_classifier: identification/runs/tooth_fdi_raw/best.pt

train:
  epochs: 60
  optimizer: AdamW
  lr: 0.0001
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 2

sampler:
  p: 16
  k: 4

loss:
  type: triplet_margin
  margin: 0.2

miner:
  type: multi_similarity
  epsilon: 0.1

augmentation:
  rotation_degrees: 10
  translate: 0.05
  brightness: 0.1
  contrast: 0.1
  blur_kernel: 3
  blur_sigma_max: 0.5
  noise_sigma: 0.01

eval:
  val_every_n_epochs: 3
  patience: 10
  save_best_metric: rank1

output:
  dir: identification/runs/embedding_fdi_init_blended_v1
  save_last: true
  save_best: true
