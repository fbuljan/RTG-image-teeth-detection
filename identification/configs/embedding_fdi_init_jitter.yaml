# Phase 8.2a — FDI-init embedder retrained with bbox-jitter augmentation.
# Identical to configs/embedding_fdi_init.yaml (the deployed embedder's config) except:
# - augmentation.translate bumped 0.05 -> 0.08
# - augmentation.scale (NEW) = [0.85, 1.15], enabling the RandomAffine isotropic scale
#   channel (simulates YOLO drawing a tighter or looser bbox than GT)
# - rotation_degrees bumped 10 -> 12 (modest, well below the Phase 8.1 +-20 deg level
#   that failed) -- rotation is included only because RandomAffine bundles it
# - new output dir + experiment name
#
# Crops are unchanged (identification/data/crops_gt/, 10% padding, letterboxed).
# Stage C (FDI classifier) is unchanged (still tooth_fdi_raw/best.pt).
# Inference path is unchanged. Registry rebuilds from crops_yolo/ as usual.
experiment_name: embedding_fdi_init_jitter_v1

data:
  manifest: identification/data/manifest_clean.csv
  crop_mode: raw
  target_col: person_id
  num_workers: 0
  pin_memory: false

model:
  backbone: resnet18
  pretrained: true
  embedding_dim: 128
  dropout: 0.2

init_from_classifier: identification/runs/tooth_fdi_raw/best.pt

train:
  epochs: 60
  optimizer: AdamW
  lr: 0.0001
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 2

sampler:
  p: 16
  k: 4

loss:
  type: triplet_margin
  margin: 0.2

miner:
  type: multi_similarity
  epsilon: 0.1

augmentation:
  rotation_degrees: 12
  translate: 0.08
  scale: [0.85, 1.15]
  brightness: 0.1
  contrast: 0.1
  blur_kernel: 3
  blur_sigma_max: 0.5
  noise_sigma: 0.01

eval:
  val_every_n_epochs: 3
  patience: 10
  save_best_metric: rank1

output:
  dir: identification/runs/embedding_fdi_init_jitter_v1
  save_last: true
  save_best: true
