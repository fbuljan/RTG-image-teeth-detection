model: yolo11m-seg.pt
data: data.yaml
epochs: 50
batch: 4
imgsz: 640
project: runs-segmentation
name: default-seg

train_args:
  val: false
  plots: true

  # Mac MPS memory settings
  cache: false
  workers: 0

  optimizer: SGD
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3

  box: 7.5
  cls: 0.5
  dfl: 1.5

  degrees: 0.0
  translate: 0.1
  scale: 0.5
  flipud: 0.0
  fliplr: 0.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4

  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0
  erasing: 0.0

  overlap_mask: true
  mask_ratio: 4

val_split: val

val_args:
  conf: 0.001
  iou: 0.6
  plots: true
