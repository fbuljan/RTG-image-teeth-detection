model: yolo11s-seg.pt
data: data.yaml
epochs: 25
batch: 4
imgsz: 512
project: runs-segmentation
name: experiment_optimized

train_args:
  val: false
  plots: false
  save_period: 10
  
  rect: false
  cache: false
  workers: 0
  patience: 15
  
  amp: true
  
  optimizer: AdamW
  lr0: 0.0008
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 5
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  
  box: 7.5
  cls: 0.5
  dfl: 1.5
  
  iou: 0.45
  
  degrees: 10.0
  translate: 0.1
  scale: 0.4
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.3
  
  mosaic: 0.0
  mixup: 0.0
  copy_paste: 0.0
  erasing: 0.15
  auto_augment: false
  
  close_mosaic: 0
  
  overlap_mask: true
  mask_ratio: 4
  
  dropout: 0.0

val_split: val

val_args:
  conf: 0.001
  iou: 0.35
  max_det: 100
  
  half: true
  verbose: false
  
  agnostic_nms: true
  save_json: false
  save_txt: false
  save_conf: true
  save_crop: false
  
  plots: true
  line_width: 2